name: Publish to PyPI

# Builds one abi3 wheel per platform (each covers every Python >= 3.11) and an
# sdist, tests every wheel against the mock backend, then uploads them with
# Trusted Publishing (OIDC): no PyPI token is stored in this repository. PyPI
# is configured to trust this repo + workflow ("publish.yml") + environment
# ("pypi") under the project's Publishing settings. A manual run only builds
# and tests.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

jobs:
  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            os: macos-latest
          # manylinux_2_28 (glibc 2.28), so the wheels also load on older
          # distributions than the runner's.
          - target: linux-x86_64
            os: ubuntu-latest
            manylinux: '2_28'
          - target: linux-aarch64
            os: ubuntu-24.04-arm
            manylinux: '2_28'
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.target }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist
          manylinux: ${{ matrix.manylinux || 'auto' }}
      - name: Test the wheel
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install dist/*.whl
          python -m pytest tests
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error

  sdist:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: [wheels, sdist]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/cev-py/
    permissions:
      id-token: write # mint the OIDC token PyPI exchanges for upload access
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Check the tag and the files
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "v$version" = "$GITHUB_REF_NAME"
          test -f "dist/cev_py-$version.tar.gz"
          for plat in macosx_11_0_arm64 manylinux_2_28_x86_64 manylinux_2_28_aarch64; do
            ls dist/cev_py-$version-cp311-abi3-*$plat*.whl
          done
          ls -l dist
      - uses: pypa/gh-action-pypi-publish@release/v1
