[package]
name = "cev-py"
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
description = "Python bindings for cev: typed, calibrated decisions in one forward pass."
repository = "https://github.com/CarterCole/python-cev"
publish = false

[lib]
name = "_native"
crate-type = ["cdylib"]

[features]
# Apple GPU, Apple's BLAS for the CPU path, NVIDIA GPU. macOS builds always
# have the first two (see the macOS dependencies below).
metal = ["cev-model/metal"]
accelerate = ["cev-model/accelerate"]
cuda = ["cev-model/cuda"]

[dependencies]
# The engine lives in https://github.com/CarterCole/rust-cev and is published
# on crates.io; nothing from it is copied here. To build against a checkout
# instead, see "Building from source" in the README.
cev-core = "0.2.1"
cev-model = "0.2.1"
cev-runtime = "0.2.1"

pyo3 = { version = "0.29", features = ["extension-module", "abi3-py311"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rayon = "1"
anyhow = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(target_os = "macos")'.dependencies]
cev-model = { version = "0.2.1", features = ["metal", "accelerate"] }
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 4
# Not stripped: with Xcode 27 any `strip` level yields a dylib that dyld
# refuses ("mis-aligned LINKEDIT string pool"). Release builds carry no
# debuginfo anyway; symbols add about 2 MB.
strip = "none"
